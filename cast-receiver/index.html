<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREZZAMUSIC TV</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
html,body{width:100%;height:100%;margin:0;background:#101724;color:white;font-family:Arial,sans-serif;overflow:hidden}
cast-media-player{position:fixed;inset:0;width:100%;height:100%}
#view{position:fixed;z-index:10;inset:0;pointer-events:none;background:linear-gradient(135deg,#101724ef,#202c43e8);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vw;box-sizing:border-box}
#app{position:absolute;top:4vh;left:5vw;font-size:2vw;letter-spacing:.16em;color:#c9d9f4}
#title{font-size:3.4vw;font-weight:700;margin:2vh 0}#artist{font-size:2.1vw;color:#cbd5e5}
#lyrics{font-size:3.4vw;font-weight:700;max-width:90%;line-height:1.3;margin:3vw 0}
#next{font-size:2.1vw;color:#aabdd4}#art{font-size:14vw;line-height:1}
#time{font-size:1.6vw;color:#aec7dd;margin-top:3vh}#cover{width:min(28vh,20vw);height:min(28vh,20vw);object-fit:cover;border-radius:1vw;box-shadow:0 1vw 3vw #0008}#track{width:74%;height:.5vw;background:#ffffff33;border-radius:10px;overflow:hidden;margin-top:2vw}#progress{height:100%;width:0%;background:#81d8f7}
</style></head><body>
<cast-media-player></cast-media-player>
<section id="view"><div id="app">FREZZAMUSIC · TV</div><img id="cover" alt="" hidden><div id="art">♫</div>
<div id="title"></div><div id="artist"></div>
<div id="lyrics" hidden></div><div id="next" hidden></div><div id="track"><div id="progress"></div></div><div id="time"></div></section>
<script>
'use strict';
const ctx=cast.framework.CastReceiverContext.getInstance(),player=ctx.getPlayerManager();
const NS='urn:x-cast:com.frezzamusic.lyrics';
let state={page:'now-playing',follow:true,lrc:'',title:'',artist:'',artwork:''},cues=[];
const by=id=>document.getElementById(id);
function parseLrc(raw){
 const out=[],rx=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
 for(const line of String(raw||'').split(/\r?\n/)){
   const markers=[...line.matchAll(rx)],text=line.replace(rx,'').trim();
   for(const m of markers){const ms=60000*Number(m[1])+1000*Number(m[2]);if(text&&Number.isFinite(ms))out.push({ms,text:text.slice(0,300)});}
 }
 return out.sort((a,b)=>a.ms-b.ms).slice(0,3000);
}
function render(){
 by('title').textContent=state.title;
 by('artist').textContent=state.artist;
 const showLyrics=state.page==='lyrics'&&cues.length>0;
 by('art').hidden=showLyrics || !!state.artwork;
 by('cover').hidden=showLyrics || !state.artwork;
 if(state.artwork && by('cover').src!==state.artwork)by('cover').src=state.artwork;
 by('lyrics').hidden=state.page!=='lyrics'||!cues.length;
 by('next').hidden=state.page!=='lyrics'||!cues.length;
}
function update(data){
 if(!data||typeof data!=='object')return;
 if(typeof data.title==='string')state.title=data.title.slice(0,250);
 if(typeof data.artist==='string')state.artist=data.artist.slice(0,250);
 if(typeof data.artwork==='string'&&/^https:\/\//i.test(data.artwork))state.artwork=data.artwork.slice(0,2000);
 if(typeof data.lrc==='string'&&data.lrc!==state.lrc){state.lrc=data.lrc.slice(0,60000);cues=parseLrc(state.lrc);}
 if(typeof data.follow==='boolean')state.follow=data.follow;
 if(data.page==='lyrics'||data.page==='now-playing'){if(state.follow || !data.follow)state.page=data.page;}
 render();
}
ctx.addCustomMessageListener(NS,event=>{try{const data=typeof event.data==='string'?JSON.parse(event.data):event.data;update(data);}catch(_){}});
player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD,request=>{
 const media=request.media||{},data=request.customData||{};
 state.title=media.metadata?.title||'';
 state.artist=media.metadata?.artist||'';
 state.artwork=media.metadata?.images?.[0]?.url||'';
 if(typeof data.lrc==='string')update(data);
 render();return request;
});
setInterval(()=>{
 if(state.page!=='lyrics'||!cues.length)return;
 const ms=(Number(player.getCurrentTimeSec?.()||0))*1000;
 let lo=0,hi=cues.length;
 while(lo<hi){const mid=(lo+hi)>>1;if(cues[mid].ms<=ms)lo=mid+1;else hi=mid;}
 const i=lo-1;
 by('lyrics').textContent=i>=0?cues[i].text:'';
 by('next').textContent=i+1<cues.length?cues[i+1].text:'';
},250);
ctx.start();
</script></body></html>
