<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREZZAMUSIC — Letras na TV</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1020;color:white;font-family:system-ui,sans-serif}
cast-media-player{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;z-index:2;left:4vw;right:4vw;bottom:8vh;text-align:center;pointer-events:none;text-shadow:0 3px 18px black}
#title{font-size:2.1vw;opacity:.85}#line{font-size:4vw;font-weight:700;line-height:1.25;margin-top:2vh}
#next{font-size:2vw;opacity:.65;margin-top:1.5vh}
</style></head><body>
<cast-media-player></cast-media-player>
<section id="overlay"><div id="title"></div><div id="line"></div><div id="next"></div></section>
<script>
'use strict';
const context=cast.framework.CastReceiverContext.getInstance();
const player=context.getPlayerManager();
const elements=['title','line','next'].map(id=>document.getElementById(id));
let cues=[];
function parseLrc(raw){
  if(typeof raw!=='string')return [];
  const result=[];
  for(const line of raw.split(/\r?\n/)){
    const pattern=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
    const matches=[...line.matchAll(pattern)];
    const lyric=line.replace(pattern,'').trim();
    if(!lyric)continue;
    for(const match of matches){
      const time=(Number(match[1])*60+Number(match[2]))*1000;
      if(Number.isFinite(time))result.push({time,text:lyric.slice(0,300)});
    }
  }
  return result.sort((a,b)=>a.time-b.time).slice(0,3000);
}
player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD,request=>{
  const media=request.media||{};
  const extras=(request.customData||media.customData||{});
  cues=parseLrc(extras.lrc||'');
  elements[0].textContent=(media.metadata&&media.metadata.title)||'';
  elements[1].textContent='';elements[2].textContent='';
  return request;
});
setInterval(()=>{
  if(!cues.length)return;
  const time=Number(player.getCurrentTimeSec?.()||0)*1000;
  let i=-1;
  for(let j=0;j<cues.length;j++){if(cues[j].time>time)break;i=j;}
  elements[1].textContent=i>=0?cues[i].text:'';
  elements[2].textContent=i+1<cues.length?cues[i+1].text:'';
},300);
context.start();
</script></body></html>
