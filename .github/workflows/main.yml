name: Build FREZZAMUSIC Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "development/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/**"

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all debug variants
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK names
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/frezzamusic/debug/app-frezzamusic-debug.apk dist/FREZZAMUSIC.apk
          cp app/build/outputs/apk/solasias/debug/app-solasias-debug.apk dist/Solasias.apk
          cp app/build/outputs/apk/thefrezza/debug/app-thefrezza-debug.apk dist/theFrezza.apk

      - name: Upload FREZZAMUSIC APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FREZZAMUSIC
          path: dist/FREZZAMUSIC.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Solasias APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Solasias
          path: dist/Solasias.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload theFrezza APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: theFrezza
          path: dist/theFrezza.apk
          if-no-files-found: error
          retention-days: 14
