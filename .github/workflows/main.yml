name: Build FREZZAMUSIC Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/**"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Build FREZZAMUSIC debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload FREZZAMUSIC APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FREZZAMUSIC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
