name: Build FREZZAMUSIC Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "development/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/**"

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all debug variants
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FREZZAMUSIC-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
