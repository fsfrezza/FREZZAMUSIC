name: Publish music sharing page
on:
  workflow_dispatch:
  push:
    branches: [development/v0.23-links]
    paths: [web/**, .github/workflows/share-pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sharing-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
